<body>

<script>

        el: '#testing',
        data: {
           message: 'hello vue'

        //computed properties

            },
            reverse() {

                // let response = reverseMesage.join("");
                // return response;
            },
            // now:{

            // }
        },
       
        //methods propertis
        methods: {
            show(){
                // alert(this.message.length);
                alert("hello");
            }
        }
    })
</script>
