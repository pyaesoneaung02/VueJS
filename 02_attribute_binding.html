<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .red-color {
            color: red;
        }
        .delete{
            text-decoration: line-through;
        }
        img{
            width: 300px;
        }
    </style>
</head>
<body>
    <div id="app">
        <input type="text" v-model="message">
        <!-- <h1 v-bind:class="textRed">{{message}}</h1> -->
        <h1 :class="[textRed,deleteMessage]">{{message}}</h1>
        <!-- <a v-bind:href="myURL" target="_blank">Youtube</a> -->
        <a :href="myURL" target="_blank">Youtube</a>
        <h1>{{message}}</h1>
        <!-- <img :src="mySrc"> -->
        <span :title="myTitle">CL</span>
        <input type="text" :disabled="status">
    </div>
</body>
<!-- development version, includes helpful console warnings -->
<script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
<!-- 

class , href, required , disabled, src,

 -->
<script>
    let app = new Vue({
        el: '#app',
        data: {
            message: "this is testing from Vue",
            textRed: 'red-color',
            deleteMessage: 'delete',
            myURL: 'https://ww.youtube',
            age: 22,
            mySrc: './image/PSA.jpg',
            myTitle: 'CODE LAB',
            status: true
        }
    })
</script>
</html>
