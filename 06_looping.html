<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    p {
        color: red;
    }
</style>

<body>
    <div id="testing">
        <input type="text" name="" id="" v-model="message">

        <h1>Looping</h1>
        <ul>
            <li v-for="(a,i) in numbers">{{i}} | {{a}}</li>
        </ul>

        <table border="1">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Gender</th>
            </tr>
            <tr v-for="item in items">
                <td>{{ item.id }}</td>
                <td>{{ item.name }}</td>
                <td>{{ item.gender }}</td>
            </tr>
        </table>
    </div>
</body>
<!-- development version, includes helpful console warnings -->
<script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
<script>
    let app = new Vue({
        el: '#testing',
        data: {
            message: '',
            numbers: ['one','two','three'],
            items : [
                {id : '1',name: 'tun tun', gender: 'male'},
                { id: '2', name: 'aung aung', gender: 'male' },
                { id: '3', name: 'su su', gender: 'female' },
            ]
        },
       
    })
</script>

</html>
